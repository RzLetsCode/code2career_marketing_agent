name: Daily Autonomous Instagram & LinkedIn Marketing

on:
  schedule:
    # 15:00 UTC = 8:30 PM IST (Peak Developer Engagement Window)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      publish_formats:
        description: 'Content Formats to Generate & Publish'
        required: true
        default: 'video'
        type: choice
        options:
          - carousel
          - video
          - both
          - none
      publish_platforms:
        description: 'Target Social Platforms'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - instagram
          - linkedin
          - none

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ===================================================================
      # 1. INSTALL SYSTEM DEPENDENCIES (FFmpeg for Video/Reel Compilation)
      # ===================================================================
      - name: Install FFmpeg
        uses: BtbN/FFmpeg-Builds@latest      
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ===================================================================
      # 2. INSTALL PLAYWRIGHT SYSTEM LIBS (Required for Headless Chromium)
      # ===================================================================
      - name: Install Playwright System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 alsa-lib

      # ===================================================================
      # 3. INSTALL PYTHON PACKAGES & PLAYWRIGHT BROWSERS
      # ===================================================================
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      # ===================================================================
      # 4. EXECUTE AUTONOMOUS MARKETING PIPELINE
      # ===================================================================
      - name: Run Autonomous Marketing Agent
        env:
          # Reads interactive dropdown choices, falling back to 'carousel' / 'both' if triggered via cron schedule
          PUBLISH_FORMATS: ${{ github.event.inputs.publish_formats || 'carousel' }}
          PUBLISH_PLATFORMS: ${{ github.event.inputs.publish_platforms || 'both' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          python -u orchestrator.py

      # ===================================================================
      # 5. COMMIT STATE HISTORY BACK TO REPOSITORY
      # ===================================================================
      - name: Commit State History Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist published topic history [skip ci]" && git push)
